upstream ventas_backend {
    server backend-ventas:8080;
}

upstream despacho_backend {
    server backend-despachos:8081;
}

server {
    listen 80;
    server_name localhost;

    # API Ventas
    location /api/ventas/ {
        proxy_pass http://ventas_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Swagger Ventas
    location /ventas/swagger-ui.html {
        proxy_pass http://ventas_backend/swagger-ui.html;
        proxy_set_header Host $host;
    }

    # API Despachos
    location /api/despachos/ {
        proxy_pass http://despacho_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Swagger Despachos
    location /despachos/swagger-ui.html {
        proxy_pass http://despacho_backend/swagger-ui.html;
        proxy_set_header Host $host;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
