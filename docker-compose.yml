services:
  mysql:
    image: mysql:8.0.35
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-ventas:
    build: ./backend/back-Ventas_SpringBoot/Springboot-API-REST
    image: ventas-backend:1.0
    ports:
      - "8080:8080"
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/actuator/health || curl -f http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-despacho:   # antes backend-despachos
    build: ./backend/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    image: despachos-backend:1.0
    ports:
      - "8081:8081"
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8081/actuator/health || curl -f http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./fronted/front_despacho
    image: despacho-frontend:1.0
    ports:
      - "3000:8080"
    environment:
      BACKEND_HOST: backend-ventas:8080
      BACKEND_HOST_DESPACHOS: backend-despacho:8081   # actualizado
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend-ventas:
        condition: service_healthy
      backend-despacho:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: