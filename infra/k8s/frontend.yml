# Despliegue Frontend Despacho
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-despacho
  labels:
    app: frontend-despacho
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-despacho
  template:
    metadata:
      labels:
        app: frontend-despacho
    spec:
      containers:
        - name: frontend-despacho
          image: "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/frontend-despacho:${IMAGE_TAG}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: backend-ventas
            - name: BACKEND_HOST_DESPACHOS
              value: backend-despacho
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Service para Frontend Despacho
apiVersion: v1
kind: Service
metadata:
  name: frontend-despacho
  labels:
    app: frontend-despacho
spec:
  selector:
    app: frontend-despacho
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP