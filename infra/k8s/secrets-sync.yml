# Instalación de AWS Secrets and Configuration Provider (ASCP)
# Este permite sincronizar secrets desde AWS Secrets Manager a Kubernetes
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-secrets-store-provider-aws
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-secrets-store-provider-aws
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-secrets-store-provider-aws
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-secrets-store-provider-aws
subjects:
  - kind: ServiceAccount
    name: csi-secrets-store-provider-aws
    namespace: kube-system

---
# SecretProviderClass para sincronizar de AWS Secrets Manager
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: despacho-rds-secrets
  namespace: despacho-app
spec:
  provider: aws
  parameters:
    secrets: |
      [
        {
          "objectName": "despacho/rds/credentials",
          "objectType": "secretsmanager",
          "objectAlias": "dbcredentials"
        }
      ]

---
# Pod example que monta los secrets
apiVersion: v1
kind: Pod
metadata:
  name: secrets-sync-test
  namespace: despacho-app
spec:
  serviceAccountName: default
  containers:
    - name: app
      image: busybox
      volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true
      command: ["cat", "/mnt/secrets/dbcredentials"]
  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.amazonaws.com
        readOnly: true
        volumeAttributes:
          secretsManagerName: despacho/rds/credentials
