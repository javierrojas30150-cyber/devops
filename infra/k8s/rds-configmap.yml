# ConfigMap para producción usando RDS
# Este archivo reemplaza mysql.yml cuando se usa RDS
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rds
  namespace: despacho-app
  labels:
    app: despacho
    environment: production
data:
  DB_ENDPOINT: despachos-mysql.c9akciq32.us-east-1.rds.amazonaws.com  # Cambiar con valor real
  DB_PORT: "3306"
  DB_NAME: despachos_db
  DB_USERNAME: admin
  # DB_PASSWORD viene del Secret de AWS Secrets Manager
  BACKEND_VENTAS_HOST: backend-ventas
  BACKEND_VENTAS_PORT: "8080"
  BACKEND_DESPACHO_HOST: backend-despacho
  BACKEND_DESPACHO_PORT: "8081"
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:G1NewCollectionHeuristicPercent=35"
  LOG_LEVEL: INFO
  ENVIRONMENT: production

---
# Secret que sincroniza con AWS Secrets Manager
# Requiere AWS Secrets and Configuration Provider (ASCP)
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-rds
  namespace: despacho-app
  labels:
    app: despacho
type: Opaque
stringData:
  # Se sincroniza desde: arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:despacho/rds/credentials
  DB_PASSWORD: ""  # Se rellena automáticamente
  DB_ENDPOINT: ""
  DB_PORT: "3306"
