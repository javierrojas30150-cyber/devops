# Horizontal Pod Autoscaler para Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-despacho-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-despacho
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50  # Escala cuando CPU > 50%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70  # Escala cuando Memory > 70%
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Espera 5 min antes de bajar
      policies:
      - type: Percent
        value: 50  # Baja máximo 50% de replicas
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Sube inmediatamente
      policies:
      - type: Percent
        value: 100  # Sube máximo 100%
        periodSeconds: 60
---
