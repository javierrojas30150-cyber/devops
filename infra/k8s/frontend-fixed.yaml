apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-despacho
  namespace: despacho-app
  labels:
    app: frontend-despacho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-despacho
  template:
    metadata:
      labels:
        app: frontend-despacho
    spec:
      containers:
        - name: frontend-despacho
          image: 548946983683.dkr.ecr.us-east-1.amazonaws.com/frontend-despacho:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: backend-ventas
            - name: BACKEND_HOST_DESPACHOS
              value: backend-despacho
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-despacho
  namespace: despacho-app
spec:
  selector:
    app: frontend-despacho
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
