# Namespace para la aplicación
apiVersion: v1
kind: Namespace
metadata:
  name: despacho-app
  labels:
    app: despacho
    environment: production

---
# ConfigMap para variables de entorno
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: despacho-app
  labels:
    app: despacho
data:
  DB_ENDPOINT: mysql-service
  DB_PORT: "3306"
  DB_NAME: despachos_db
  DB_USERNAME: despacho_user
  BACKEND_VENTAS_HOST: backend-ventas
  BACKEND_VENTAS_PORT: "8080"
  BACKEND_DESPACHO_HOST: backend-despacho
  BACKEND_DESPACHO_PORT: "8081"
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:G1NewCollectionHeuristicPercent=35"
  LOG_LEVEL: INFO
  ENVIRONMENT: production

---
# Secret para credenciales de base de datos
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: despacho-app
  labels:
    app: despacho
type: Opaque
stringData:
  DB_PASSWORD: "tu_contraseña_segura_aqui"  # Cambiar en producción
  DB_ROOT_PASSWORD: "tu_root_password_aqui"  # Cambiar en producción
  MYSQL_USER: despacho_user
  MYSQL_PASSWORD: "tu_contraseña_segura_aqui"  # Cambiar en producción

---
# Secret para ECR (si es necesario)
apiVersion: v1
kind: Secret
metadata:
  name: ecr-registry-secret
  namespace: despacho-app
type: kubernetes.io/dockercfg
data:
  # Base64 encoded .dockercfg file
  # Generar con: aws ecr get-login-password --region us-east-1 | base64
  .dockercfg: {}
