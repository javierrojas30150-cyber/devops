# Despliegue Backend Despacho
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despacho
  labels:
    app: backend-despacho
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-despacho
  template:
    metadata:
      labels:
        app: backend-despacho
    spec:
      containers:
        - name: backend-despacho
          image: "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/backend-despacho:${IMAGE_TAG}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: DB_ENDPOINT
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: despachos
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
---
# Service para Backend Despacho
apiVersion: v1
kind: Service
metadata:
  name: backend-despacho
  labels:
    app: backend-despacho
spec:
  selector:
    app: backend-despacho
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP