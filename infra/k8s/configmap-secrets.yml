# ConfigMap para variables de entorno y configuración
apiVersion: v1
kind: ConfigMap
metadata:
  name: despacho-config
  namespace: default
  labels:
    app: despacho-app
data:
  # Configuración de Base de Datos
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "despachos"
  
  # Configuración de Backend
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xms256m -Xmx512m"
  SPRING_PROFILES_ACTIVE: "prod"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_CITT: "DEBUG"
  
  # Configuración de Frontend
  VITE_API_BASE_URL: "/api"
  VITE_BACKEND_HOST: "backend-ventas:8080"
  VITE_BACKEND_HOST_DESPACHOS: "backend-despacho:8081"
  
  # Configuración de Observabilidad
  ACTUATOR_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,readiness,info,prometheus,metrics"
  MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: "/actuator"
  
---
# Secret para credenciales de base de datos
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: default
  labels:
    app: despacho-app
type: Opaque
stringData:
  DB_USERNAME: "root"
  DB_PASSWORD: "S3gura!P4ssw0rd2026"
  DB_ROOT_PASSWORD: "S3gura!P4ssw0rd2026"

---
# ServiceAccount para aplicación (para RBAC)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: despacho-app-sa
  namespace: default
  labels:
    app: despacho-app

---
# ClusterRole para lectura de configuración y métricas
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: despacho-app-reader
  labels:
    app: despacho-app
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: despacho-app-reader-binding
  labels:
    app: despacho-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: despacho-app-reader
subjects:
- kind: ServiceAccount
  name: despacho-app-sa
  namespace: default
