apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: despacho-app
  labels:
    app: despacho
data:
  DB_ENDPOINT: mysql-service
  DB_PORT: "3306"
  DB_NAME: despachos_db
  DB_USERNAME: despacho_user
  BACKEND_VENTAS_HOST: backend-ventas
  BACKEND_VENTAS_PORT: "8080"
  BACKEND_DESPACHO_HOST: backend-despacho
  BACKEND_DESPACHO_PORT: "8081"
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:G1NewCollectionHeuristicPercent=35"
  LOG_LEVEL: INFO
  ENVIRONMENT: production
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: despacho-app
  labels:
    app: despacho
type: Opaque
stringData:
  DB_PASSWORD: "tu_contraseña_segura_aqui"
  DB_ROOT_PASSWORD: "tu_root_password_aqui"
  MYSQL_USER: despacho_user
  MYSQL_PASSWORD: "tu_contraseña_segura_aqui"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: despacho-app-sa
  namespace: despacho-app
  labels:
    app: despacho-app
