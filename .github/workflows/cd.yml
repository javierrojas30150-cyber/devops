name: Despliegue continuo

on:
  push:
    branches:
      - devops

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: despachos-cluster   # Nombre del clúster EKS (definido en Terraform)
  NAMESPACE: default

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # --- 1. COMPILACIÓN DE AMBOS BACKENDS (JAVA/MAVEN) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backends JARs
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          cd ../../back-Ventas_SpringBoot/Springboot-API-REST
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # --- 2. COMPILACIÓN DEL FRONTEND (NODE/VITE) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './front_despacho/package-lock.json'

      - name: Build Frontend Production
        run: |
          cd front_despacho
          npm install
          npm run build

      # --- 3. CONFIGURACIÓN DE CREDENCIALES DE AWS (usando access keys) ---
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        id: get-account-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      # --- 4. BUILD, TAG Y PUSH DE IMÁGENES (con versión = SHA del commit) ---
      - name: Build y Push Ventas Backend
        id: build-ventas
        run: |
          IMAGE_TAG=${{ github.sha }}
          REPO=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend-ventas
          docker build --platform linux/amd64 -t $REPO:$IMAGE_TAG -t $REPO:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push --all-tags $REPO
          echo "image=$REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build y Push Despacho Backend
        id: build-despacho
        run: |
          IMAGE_TAG=${{ github.sha }}
          REPO=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend-despacho
          docker build --platform linux/amd64 -t $REPO:$IMAGE_TAG -t $REPO:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push --all-tags $REPO
          echo "image=$REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build y Push Frontend
        id: build-frontend
        run: |
          IMAGE_TAG=${{ github.sha }}
          REPO=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend-despacho
          docker build --platform linux/amd64 -t $REPO:$IMAGE_TAG -t $REPO:latest ./front_despacho
          docker push --all-tags $REPO
          echo "image=$REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # --- 5. CONFIGURAR KUBECTL Y DESPLEGAR INGRESS PÚBLICO ---
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Verificar disponibilidad del Cluster EKS
        continue-on-error: true
        id: check-cluster
        run: |
          echo "Verificando disponibilidad del cluster EKS..."
          if aws eks describe-cluster --name despachos-cluster --region ${{ env.AWS_REGION }} 2>&1 | grep -q "ACTIVE\|CREATING"; then
            echo "status=available" >> $GITHUB_OUTPUT
            echo "Cluster EKS disponible"
          else
            echo "status=not-available" >> $GITHUB_OUTPUT
            echo "Cluster EKS no disponible (aún no creado)"
          fi

      - name: Configurar kubeconfig para EKS
        if: steps.check-cluster.outputs.status == 'available'
        continue-on-error: true
        id: kubeconfig
        run: |
          echo "Configurando acceso al cluster EKS..."
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Verificar conexión al cluster
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Verificando conexión al cluster..."
          kubectl cluster-info
          echo "Conexión OK"

      - name: Desplegar ConfigMap y Secrets
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Desplegando ConfigMap y Secrets..."
          kubectl apply -f infra/k8s/configmap-secrets.yml --validate=false
          echo "ConfigMap y Secrets aplicados"

      - name: Deploy MySQL
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Desplegando MySQL..."
          kubectl apply -f infra/k8s/mysql.yml --validate=false
          echo "MySQL desplegado"
          echo "Esperando a que MySQL esté listo..."
          kubectl wait --for=condition=ready pod -l app=mysql --timeout=300s --ignore-not-found=true
          echo "MySQL está listo"

      - name: Deploy Backend Despacho
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Desplegando Backend Despacho..."
          kubectl apply -f infra/k8s/backend.yml --validate=false
          echo "Backend Despacho desplegado"
          echo "Esperando a que Backend Despacho esté listo..."
          kubectl wait --for=condition=ready pod -l app=backend-despacho --timeout=300s --ignore-not-found=true
          echo "Backend Despacho está listo"

      - name: Deploy Backend Ventas
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Desplegando Backend Ventas..."
          kubectl apply -f infra/k8s/backend-ventas.yml --validate=false
          echo "Backend Ventas desplegado"
          echo "Esperando a que Backend Ventas esté listo..."
          kubectl wait --for=condition=ready pod -l app=backend-ventas --timeout=300s --ignore-not-found=true
          echo "Backend Ventas está listo"

      - name: Deploy Frontend
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Desplegando Frontend..."
          kubectl apply -f infra/k8s/frontend.yml --validate=false
          echo "Frontend desplegado"
          echo "Esperando a que Frontend esté listo..."
          kubectl wait --for=condition=ready pod -l app=frontend-despacho --timeout=300s --ignore-not-found=true
          echo "Frontend está listo"

      - name: Desplegar Ingress PÚBLICO (sin autenticación)
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Desplegando Ingress público sin autenticación..."
          kubectl apply -f infra/k8s/ingress.yml --validate=false
          echo "Ingress aplicado"

      - name: Desplegar HPA (Horizontal Pod Autoscaler)
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Desplegando Horizontal Pod Autoscalers..."
          kubectl apply -f infra/k8s/hpa.yml --validate=false
          echo "HPA aplicados"
          echo ""
          echo "HPA Configurados:"
          kubectl get hpa -o wide

      - name: Obtener URL pública del Frontend
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        id: get-url
        run: |
          echo "Esperando a que AWS ALB asigne la URL pública..."
          echo ""
          FRONTEND_URL=""
          for i in {1..30}; do
            FRONTEND_URL=$(kubectl get ingress despacho-ingress -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ -n "$FRONTEND_URL" ]; then
              echo "URL PÚBLICA DISPONIBLE (SIN CONTRASEÑA):"
              echo ""
              echo "   Frontend:        http://$FRONTEND_URL"
              echo "   API Ventas:      http://$FRONTEND_URL/api/ventas/"
              echo "   API Despachos:   http://$FRONTEND_URL/api/despachos/"
              echo ""
              echo "La aplicación está lista para usar"
              echo "   ✓ Frontend accesible públicamente"
              echo "   ✓ Sin autenticación requerida"
              echo "   ✓ Backends respondiendo"
              echo ""
              echo "frontend_url=http://$FRONTEND_URL" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ $((i % 5)) -eq 0 ]; then
              echo "   Intento $i/30 - Esperando ALB..."
            fi
            sleep 5
          done
          echo ""
          echo "Timeout esperando URL del ALB"
          echo "   AWS puede tardar hasta 5 minutos en asignar el DNS"
          echo ""
          echo "Para verificar manualmente, ejecuta:"
          echo "   kubectl get ingress despacho-ingress -n default"
          echo ""
          echo "   O para obtener solo la URL:"
          echo "   kubectl get ingress despacho-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'"
          exit 0

      - name: Obtener URL del Frontend (LoadBalancer)
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "Obteniendo URL del Frontend desde el Servicio LoadBalancer..."
          kubectl get svc frontend-despacho
          echo ""
          FRONTEND_LB=$(kubectl get service frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null) || echo "Buscando dirección..."
          if [ -n "$FRONTEND_LB" ]; then
            echo "URL del LoadBalancer: http://$FRONTEND_LB"
          else
            echo "El LoadBalancer aún no tiene asignada una dirección pública"
          fi

      - name: Cluster EKS no disponible - Instrucciones
        if: steps.check-cluster.outputs.status == 'not-available'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "CLUSTER EKS NO DISPONIBLE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Las imágenes Docker se compilaron exitosamente ✓"
          echo "Se subieron a ECR ✓"
          echo ""
          echo "Pero el Cluster EKS no existe todavía."
          echo ""
          echo "PRÓXIMOS PASOS:"
          echo "──────────────────────────────────────────────────"
          echo ""
          echo "  Crear la infraestructura localmente:"
          echo ""
          echo "    cd infra/terraform"
          echo "    terraform init"
          echo "    terraform plan"
          echo "    terraform apply"
          echo ""
          echo "  Espera ~20 minutos a que se cree:"
          echo "    ✓ VPC + Subnets"
          echo "    ✓ Internet Gateway + NAT Gateway"
          echo "    ✓ ECR Repositories (ya están listos)"
          echo ""
          echo "  Luego haz push para desplegar:"
          echo ""
          echo "    git push origin devops"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📌 Nota: Si necesitas EKS en lugar de solo VPC/ECR,"
          echo "         el admin debe crear 2 roles IAM primero."
          echo ""