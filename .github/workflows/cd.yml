name: Despliegue continuo

on:
  push:
    branches:
      - devops

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: despachos-cluster   # Nombre del clúster EKS (definido en Terraform)
  NAMESPACE: default

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # --- 1. COMPILACIÓN DE AMBOS BACKENDS (JAVA/MAVEN) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backends JARs
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          cd ../../back-Ventas_SpringBoot/Springboot-API-REST
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # --- 2. COMPILACIÓN DEL FRONTEND (NODE/VITE) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './front_despacho/package-lock.json'

      - name: Build Frontend Production
        run: |
          cd front_despacho
          npm install
          npm run build

      # --- 3. CONFIGURACIÓN DE CREDENCIALES DE AWS (usando access keys) ---
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- 4. BUILD, TAG Y PUSH DE IMÁGENES (con versión = SHA del commit) ---
      - name: Build y Push Ventas Backend
        id: build-ventas
        run: |
          IMAGE_TAG=${{ github.sha }}
          REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend-ventas
          docker build --platform linux/amd64 -t $REPO:$IMAGE_TAG -t $REPO:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push --all-tags $REPO
          echo "image=$REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build y Push Despacho Backend
        id: build-despacho
        run: |
          IMAGE_TAG=${{ github.sha }}
          REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend-despacho
          docker build --platform linux/amd64 -t $REPO:$IMAGE_TAG -t $REPO:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push --all-tags $REPO
          echo "image=$REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build y Push Frontend
        id: build-frontend
        run: |
          IMAGE_TAG=${{ github.sha }}
          REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend-despacho
          docker build --platform linux/amd64 -t $REPO:$IMAGE_TAG -t $REPO:latest ./front_despacho
          docker push --all-tags $REPO
          echo "image=$REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # --- 5. CONFIGURAR KUBECTL PARA ACCEDER AL CLUSTER EKS ---
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configurar kubeconfig para EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      # --- 6. ACTUALIZAR DEPLOYMENTS CON LAS NUEVAS IMÁGENES ---
      - name: Actualizar imágenes en los deployments
        run: |
          kubectl set image deployment/backend-ventas   backend-ventas=${{ steps.build-ventas.outputs.image }} -n ${{ env.NAMESPACE }}
          kubectl set image deployment/backend-despacho backend-despacho=${{ steps.build-despacho.outputs.image }} -n ${{ env.NAMESPACE }}
          kubectl set image deployment/frontend-despacho frontend-despacho=${{ steps.build-frontend.outputs.image }} -n ${{ env.NAMESPACE }}

      # --- 7. VERIFICAR QUE EL ROLLOUT SEA EXITOSO ---
      - name: Verificar estado del rollout
        run: |
          kubectl rollout status deployment/backend-ventas   -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/backend-despacho -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/frontend-despacho -n ${{ env.NAMESPACE }} --timeout=5m