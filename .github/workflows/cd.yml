name: CD - Deploy to EKS

on:
  workflow_run:
    workflows:
      - CI - Build & Push Docker Images
    types:
      - completed

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: innovatech-eks
  PROJECT_NAME: innovatech

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener URLs ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          echo "FRONTEND_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-frontend" >> $GITHUB_ENV
          echo "VENTAS_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-ventas" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-despachos" >> $GITHUB_ENV

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      - name: Crear Secret
        run: |
          cat > infra/k8s/secret.yml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: mysql-secret
          type: Opaque
          stringData:
            MYSQL_ROOT_PASSWORD: "${{ secrets.MYSQL_ROOT_PASSWORD }}"
            SPRING_DATASOURCE_USERNAME: "${{ secrets.MYSQL_USER }}"
            SPRING_DATASOURCE_PASSWORD: "${{ secrets.MYSQL_PASSWORD }}"
          EOF

          kubectl apply -f infra/k8s/secret.yml

      - name: Aplicar manifiestos
        run: |
          kubectl apply -f infra/k8s/mysql.yml
          kubectl apply -f infra/k8s/backend-ventas.yml
          kubectl apply -f infra/k8s/backend-despachos.yml
          kubectl apply -f infra/k8s/frontend.yml
          kubectl apply -f infra/k8s/hpa.yml
          kubectl apply -f infra/k8s/ingress.yml

      - name: Actualizar imágenes
        run: |
          kubectl set image deployment/backend-ventas \
            back-ventas=$VENTAS_ECR:${{ github.event.workflow_run.head_sha }}

          kubectl set image deployment/backend-despachos \
            back-despachos=$DESPACHOS_ECR:${{ github.event.workflow_run.head_sha }}

          kubectl set image deployment/frontend-despacho \
            frontend=$FRONTEND_ECR:${{ github.event.workflow_run.head_sha }}

      - name: Esperar rollout
        run: |
          kubectl rollout status deployment/backend-ventas --timeout=300s
          kubectl rollout status deployment/backend-despachos --timeout=300s
          kubectl rollout status deployment/frontend-despacho --timeout=300s

      - name: Estado del clúster
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide
          kubectl get hpa

      - name: Obtener URL del Frontend
        continue-on-error: true
        run: |
          echo "Esperando una URL pública para el frontend..."

          for i in {1..40}; do
            INGRESS_HOST=$(kubectl get ingress frontend-despacho-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            INGRESS_IP=$(kubectl get ingress frontend-despacho-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            SVC_HOST=$(kubectl get svc frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            SVC_IP=$(kubectl get svc frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

            ENDPOINT="${INGRESS_HOST:-${INGRESS_IP:-${SVC_HOST:-$SVC_IP}}}"

            if [ -n "$ENDPOINT" ]; then
              echo ""
              echo "========================================="
              echo "✓ Frontend Despacho disponible en:"
              echo "http://$ENDPOINT"
              echo "========================================="
              exit 0
            fi

            echo "Intento $i/40: buscando URL pública..."
            kubectl get svc frontend-despacho -o wide || true
            sleep 15
          done

          echo "⚠ No se obtuvo una URL pública aún. Revisa el estado del Ingress/Service:"
          kubectl get ingress frontend-despacho-ingress -o wide || true
          kubectl get svc frontend-despacho -o wide || true
          kubectl describe svc frontend-despacho || true
          