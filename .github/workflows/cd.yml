name: Despliegue Continuo

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - devops

env:
  AWS_REGION: us-east-1
  CLUSTER: innovatech-cluster
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  deploy:
    name: Despliegue a AWS EKS
    runs-on: ubuntu-latest
    outputs:
      frontend_url: ${{ steps.frontend-url.outputs.frontend_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC if available)
        id: aws-config-oidc
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        id: aws-config-keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fail if AWS credentials are not configured
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' && (env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '') }}
        run: |
          echo "ERROR: AWS credentials are not configured. Set AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY in repository secrets." >&2
          exit 1

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate AWS credentials
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' || env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          echo "Validating AWS credentials..."
          if aws sts get-caller-identity >/dev/null 2>&1; then
            aws sts get-caller-identity
          else
            echo "ERROR: AWS credentials invalid or missing. Ensure AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are configured." >&2
            exit 1
          fi

      - name: Obtener AWS Account ID y definir variables
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' || env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_ENV

      - name: Login en ECR
        id: login-ecr
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if aws ecr describe-registry >/dev/null 2>&1; then
              echo "ECR registry reachable. Logging in..."
              aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
              exit 0
            fi
            echo "Attempt $attempt/3: ECR login failed. Credentials may be expired or invalid."
            sleep 5
          done
          echo "ERROR: ECR login failed. Check AWS credentials and ECR permissions." >&2
          exit 1

      - name: Build y Push Imágenes
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/innovatech-ventas-backend:${{ github.sha }} ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/innovatech-ventas-backend:${{ github.sha }}

          docker build --platform linux/amd64 -t $ECR_REGISTRY/innovatech-despacho-backend:${{ github.sha }} ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/innovatech-despacho-backend:${{ github.sha }}

          docker build --platform linux/amd64 -t $ECR_REGISTRY/innovatech-frontend:${{ github.sha }} ./front_despacho
          docker push $ECR_REGISTRY/innovatech-frontend:${{ github.sha }}

      - name: Update Kubeconfig for EKS (with retries & diagnostics)
        run: |
          set -euo pipefail
          CLUSTER_NAME="${EKS_CLUSTER_NAME:-${CLUSTER}}"
          echo "Updating kubeconfig for EKS cluster ${CLUSTER_NAME} in ${{ env.AWS_REGION }}"
          ATTEMPTS=3
          i=0
          until [ $i -ge $ATTEMPTS ]
          do
            if aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${{ env.AWS_REGION }}"; then
              echo "kubeconfig updated"
              break
            else
              echo "Attempt $((i+1))/$ATTEMPTS: update-kubeconfig failed, retrying in 5s..."
              sleep 5
            fi
            i=$((i+1))
          done
          if [ $i -ge $ATTEMPTS ]; then
            echo "ERROR: update-kubeconfig failed after $ATTEMPTS attempts" >&2
            echo "Describe cluster for diagnostics:"
            aws eks describe-cluster --name "${CLUSTER_NAME}" --region "${{ env.AWS_REGION }}" || true
            echo "Current KUBECONFIG content (if any):"
            if [ -f ~/.kube/config ]; then
              sed -n '1,120p' ~/.kube/config || true
            else
              echo "~/.kube/config not found"
            fi
            exit 1
          fi
          kubectl config current-context
          kubectl config view --minify --output yaml
          kubectl cluster-info || true
          kubectl version --short || true

      - name: Deploy Secrets and Config
        run: |
          if [ -f infra/k8s/secret.yml ]; then
            kubectl apply -f infra/k8s/secret.yml
          else
            echo "infra/k8s/secret.yml not found, skipping"
          fi

      - name: Deploy Infrastructure and Database
        run: |
          if [ -f infra/k8s/mysql.yml ]; then
            kubectl apply -f infra/k8s/mysql.yml
          else
            echo "infra/k8s/mysql.yml not found, skipping"
          fi

      - name: Deploy Microservices
        run: |
          for f in infra/k8s/deployments.yml infra/k8s/services.yml infra/k8s/autoscaling.yml; do
            if [ -f "$f" ]; then
              kubectl apply -f "$f"
            else
              echo "$f not found, skipping"
            fi
          done

      - name: Verificar nodos y pods del clúster
        run: |
          echo "Nodos disponibles:"
          kubectl get nodes || true
          echo "Pods del clúster:"
          kubectl get pods -A || true

      - name: Verificar que los Deployments existan
        run: |
          for deployment in frontend ventas-backend despacho-backend; do
            kubectl get deployment "$deployment" >/dev/null 2>&1 || {
              echo "ERROR: deployment/$deployment was not found in the cluster." >&2
              exit 1
            }
          done

      - name: Actualizar imágenes en el clúster
        run: |
          kubectl set image deployment/ventas-backend ventas-container=$ECR_REGISTRY/innovatech-ventas-backend:${{ github.sha }}
          kubectl set image deployment/despacho-backend despacho-container=$ECR_REGISTRY/innovatech-despacho-backend:${{ github.sha }}
          kubectl set image deployment/frontend frontend-container=$ECR_REGISTRY/innovatech-frontend:${{ github.sha }}

      - name: Verificar despliegue (Rollout Status)
        run: |
          kubectl rollout status deployment/ventas-backend --timeout=300s
          kubectl rollout status deployment/despacho-backend --timeout=300s
          kubectl rollout status deployment/frontend --timeout=300s

      - name: Obtener URL pública del frontend
        id: frontend-url
        run: |
          set -euo pipefail
          echo "Esperando que el LoadBalancer del frontend obtenga una dirección externa..."
          for attempt in $(seq 1 20); do
            kubectl get svc frontend || true
            URL=$(kubectl get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$URL" ]; then
              URL=$(kubectl get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$URL" ]; then
              echo "frontend_url=$URL" >> "$GITHUB_OUTPUT"
              echo "Frontend URL: http://$URL"
              echo "## Frontend URL" >> "$GITHUB_STEP_SUMMARY"
              echo "http://$URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "LoadBalancer still pending (attempt $attempt/20)."
            kubectl get pods -A || true
            sleep 30
          done
          echo "Frontend LoadBalancer did not receive an address in time." >&2
          kubectl get svc frontend || true
          exit 1