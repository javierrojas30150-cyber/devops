name: CD - Deploy to EKS

on:
  workflow_run:
    workflows:
      - CI - Build & Push Docker Images
    types:
      - completed
    branches:
      - devops
  push:
    branches:
      - devops
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: innovatech-eks
  PROJECT_NAME: innovatech

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener URLs ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${{ github.sha }}"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "FRONTEND_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-frontend" >> $GITHUB_ENV
          echo "VENTAS_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-ventas" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-despachos" >> $GITHUB_ENV

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      - name: Crear Secret
        run: |
          cat > infra/k8s/secret.yml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: mysql-secret
          type: Opaque
          stringData:
            MYSQL_ROOT_PASSWORD: "${{ secrets.MYSQL_ROOT_PASSWORD }}"
            SPRING_DATASOURCE_USERNAME: "${{ secrets.MYSQL_USER }}"
            SPRING_DATASOURCE_PASSWORD: "${{ secrets.MYSQL_PASSWORD }}"
          EOF

          kubectl apply -f infra/k8s/secret.yml

      - name: Esperar imágenes en ECR
        run: |
          for i in {1..30}; do
            if aws ecr describe-images --repository-name ${PROJECT_NAME}-frontend --image-ids imageTag=${IMAGE_TAG} >/dev/null 2>&1 && \
               aws ecr describe-images --repository-name ${PROJECT_NAME}-ventas --image-ids imageTag=${IMAGE_TAG} >/dev/null 2>&1 && \
               aws ecr describe-images --repository-name ${PROJECT_NAME}-despachos --image-ids imageTag=${IMAGE_TAG} >/dev/null 2>&1; then
              echo "Las imágenes para ${IMAGE_TAG} ya están disponibles en ECR."
              exit 0
            fi
            echo "Esperando que las imágenes ${IMAGE_TAG} aparezcan en ECR... intento $i/30"
            sleep 15
          done

          echo "No se encontraron las imágenes en ECR a tiempo."
          exit 1

      - name: Aplicar manifiestos
        run: |
          kubectl apply -f infra/k8s/mysql.yml
          kubectl apply -f infra/k8s/backend-ventas.yml
          kubectl apply -f infra/k8s/backend-despachos.yml
          kubectl apply -f infra/k8s/frontend.yml
          kubectl apply -f infra/k8s/hpa.yml
          kubectl apply -f infra/k8s/ingress.yml

      - name: Actualizar imágenes
        run: |
          kubectl set image deployment/backend-ventas \
            back-ventas=$VENTAS_ECR:${IMAGE_TAG}

          kubectl set image deployment/backend-despachos \
            back-despachos=$DESPACHOS_ECR:${IMAGE_TAG}

          kubectl set image deployment/frontend-despacho \
            frontend=$FRONTEND_ECR:${IMAGE_TAG}

      - name: Esperar rollout
        continue-on-error: true
        run: |
          echo "Verificando rollout de los deployments..."
          kubectl rollout status deployment/backend-ventas --timeout=300s || true
          kubectl rollout status deployment/backend-despachos --timeout=300s || true
          kubectl rollout status deployment/frontend-despacho --timeout=300s || true

      - name: Estado del clúster
        run: |
          echo "=== Pods ==="
          kubectl get pods -o wide || true
          echo "=== Servicios ==="
          kubectl get svc -o wide || true
          echo "=== HPA ==="
          kubectl get hpa || true
          echo "=== Describiendo backend-ventas ==="
          kubectl describe deployment backend-ventas || true
          echo "=== Describiendo backend-despachos ==="
          kubectl describe deployment backend-despachos || true
          echo "=== Describiendo frontend-despacho ==="
          kubectl describe deployment frontend-despacho || true
          echo "=== Eventos recientes ==="
          kubectl get events --sort-by=.metadata.creationTimestamp || true

      - name: Obtener URL del Frontend
        continue-on-error: true
        run: |
          echo "Esperando una URL pública para el frontend..."

          for i in {1..40}; do
            INGRESS_HOST=$(kubectl get ingress frontend-despacho-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            INGRESS_IP=$(kubectl get ingress frontend-despacho-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            SVC_HOST=$(kubectl get svc frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            SVC_IP=$(kubectl get svc frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

            ENDPOINT="${INGRESS_HOST:-${INGRESS_IP:-${SVC_HOST:-$SVC_IP}}}"

            if [ -n "$ENDPOINT" ]; then
              echo ""
              echo "========================================="
              echo "✓ Frontend Despacho disponible en:"
              echo "http://$ENDPOINT"
              echo "========================================="
              exit 0
            fi

            echo "Intento $i/40: buscando URL pública..."
            kubectl get svc frontend-despacho -o wide || true
            sleep 15
          done

          echo "⚠ No se obtuvo una URL pública aún. Revisa el estado del Ingress/Service:"
          kubectl get ingress frontend-despacho-ingress -o wide || true
          kubectl get svc frontend-despacho -o wide || true
          kubectl describe svc frontend-despacho || true
          