name: CI - Build & Push Docker Images
#hola
on:
  push:
    branches:
      - devops

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: innovatech-eks
  PROJECT_NAME: innovatech

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Crear repositorios ECR si no existen
        run: |
          for REPO in ${PROJECT_NAME}-frontend ${PROJECT_NAME}-ventas ${PROJECT_NAME}-despachos; do
            if ! aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1; then
              echo "Creando repositorio ECR: $REPO"
              aws ecr create-repository --repository-name "$REPO" >/dev/null
            else
              echo "Repositorio ECR ya existe: $REPO"
            fi
          done

      - name: Obtener URLs ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          echo "FRONTEND_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-frontend" >> $GITHUB_ENV
          echo "VENTAS_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-ventas" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-despachos" >> $GITHUB_ENV

      - name: Build Backend Ventas
        run: |
          docker build \
            -t $VENTAS_ECR:${GITHUB_SHA} \
            -t $VENTAS_ECR:latest \
            ./backend/back-Ventas_SpringBoot/Springboot-API-REST

      - name: Push Backend Ventas
        run: |
          docker push $VENTAS_ECR:${GITHUB_SHA}
          docker push $VENTAS_ECR:latest

      - name: Build Backend Despachos
        run: |
          docker build \
            -t $DESPACHOS_ECR:${GITHUB_SHA} \
            -t $DESPACHOS_ECR:latest \
            ./backend/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Push Backend Despachos
        run: |
          docker push $DESPACHOS_ECR:${GITHUB_SHA}
          docker push $DESPACHOS_ECR:latest

      - name: Build Frontend
        run: |
          docker build \
            -t $FRONTEND_ECR:${GITHUB_SHA} \
            -t $FRONTEND_ECR:latest \
            ./fronted/front_despacho

      - name: Push Frontend
        run: |
          docker push $FRONTEND_ECR:${GITHUB_SHA}
          docker push $FRONTEND_ECR:latest

      - name: Configurar kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - name: Obtener URL del Frontend (LoadBalancer)
        run: |
          kubectl get svc frontend-despacho -n default
          kubectl get service frontend-despacho -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || echo "Buscando dirección..."