name: Intregación Continua

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - devops
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests (Despacho)
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test -DskipTests=false

      - name: Run Backend Tests (Venta)
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test -DskipTests=false

  # --- TRABAJO 2: TESTEAR EL FRONTEND (REACT) ---
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'front_despacho/package-lock.json'

      - name: Install Dependencies
        working-directory: front_despacho
        run: |
          npm ci --no-audit --no-fund

      - name: Run Frontend Tests
        working-directory: front_despacho
        run: |
          npm test
      
      # --- 3. COMPILACIÓN DE AMBOS BACKENDS (JAVA/MAVEN) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backends JARs
        run: |
          set -e
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
          cd ../../back-Ventas_SpringBoot/Springboot-API-REST
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
      
      # --- 4. COMPILACIÓN DEL FRONTEND (NODE/VITE) ---
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend Production
        working-directory: front_despacho
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Skip AWS deployment steps
        run: |
          echo "AWS deployment steps are disabled in CI to avoid failures."
          echo "To enable, set the repository secret AWS_ROLE_TO_ASSUME (recommended) or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."