name: CI - Build & Push Docker Images
#hola
on:
  push:
    branches:
      - devops

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: innovatech-eks
  PROJECT_NAME: innovatech

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Obtener URL del Frontend (LoadBalancer)
        continue-on-error: true
        run: |
          echo "Intentando obtener la URL del servicio frontend..."

          if ! aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME" 2>/dev/null; then
            echo "No fue posible conectar con el clúster EKS desde este runner."
            echo "Revisa que el rol de AWS tenga permisos para eks:DescribeCluster y que el clúster exista."
            exit 0
          fi

          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "El contexto de Kubernetes no está disponible en este runner."
            exit 0
          fi

          if ! kubectl get svc frontend-despacho >/dev/null 2>&1; then
            echo "El servicio frontend-despacho aún no existe en el cluster."
            echo "Esto suele pasar si el despliegue aún no se aplicó desde CD."
            echo "La URL pública se obtendrá cuando el servicio esté creado y AWS le asigne una dirección."
            exit 0
          fi

          echo "Servicio frontend:"
          kubectl get svc frontend-despacho -o wide

          for i in {1..40}; do
            FRONTEND_HOST=$(kubectl get service frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            FRONTEND_IP=$(kubectl get service frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

            if [ -n "$FRONTEND_HOST" ]; then
              echo "FRONTEND_URL=$FRONTEND_HOST" >> "$GITHUB_ENV"
              echo "URL del frontend: http://$FRONTEND_HOST"
              exit 0
            fi

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_URL=$FRONTEND_IP" >> "$GITHUB_ENV"
              echo "URL del frontend: http://$FRONTEND_IP"
              exit 0
            fi

            echo "Intento $i/40: esperando dirección pública del LoadBalancer..."
            sleep 15
          done

          echo "La URL pública aún no está disponible."
          echo "Revisa el estado del servicio y del controlador de LoadBalancer en EKS."
          kubectl describe svc frontend-despacho || true

      - name: Obtener URLs ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          echo "FRONTEND_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-frontend" >> $GITHUB_ENV
          echo "VENTAS_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-ventas" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-despachos" >> $GITHUB_ENV

      - name: Build Backend Ventas
        run: |
          docker build \
            -t $VENTAS_ECR:${GITHUB_SHA} \
            -t $VENTAS_ECR:latest \
            ./backend/back-Ventas_SpringBoot/Springboot-API-REST

      - name: Push Backend Ventas
        run: |
          docker push $VENTAS_ECR:${GITHUB_SHA}
          docker push $VENTAS_ECR:latest

      - name: Build Backend Despachos
        run: |
          docker build \
            -t $DESPACHOS_ECR:${GITHUB_SHA} \
            -t $DESPACHOS_ECR:latest \
            ./backend/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Push Backend Despachos
        run: |
          docker push $DESPACHOS_ECR:${GITHUB_SHA}
          docker push $DESPACHOS_ECR:latest

      - name: Build Frontend
        run: |
          docker build \
            -t $FRONTEND_ECR:${GITHUB_SHA} \
            -t $FRONTEND_ECR:latest \
            ./fronted/front_despacho

      - name: Push Frontend
        run: |
          docker push $FRONTEND_ECR:${GITHUB_SHA}
          docker push $FRONTEND_ECR:latest