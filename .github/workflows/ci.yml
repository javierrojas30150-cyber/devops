name: Intregación Continua

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - devops
env:
  AWS_REGION: us-east-1
  CLUSTER: innovatech-cluster
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests (Despacho)
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test -DskipTests=false

      - name: Run Backend Tests (Venta)
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test -DskipTests=false

  # --- TRABAJO 2: TESTEAR EL FRONTEND (REACT) ---
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'front_despacho/package-lock.json'

      - name: Install Dependencies
        working-directory: front_despacho
        run: |
          npm ci --no-audit --no-fund

      - name: Run Frontend Tests
        working-directory: front_despacho
        run: |
          npm test
      
      # --- 3. COMPILACIÓN DE AMBOS BACKENDS (JAVA/MAVEN) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backends JARs
        run: |
          set -e
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
          cd ../../back-Ventas_SpringBoot/Springboot-API-REST
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
      
      # --- 4. COMPILACIÓN DEL FRONTEND (NODE/VITE) ---
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend Production
        working-directory: front_despacho
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Configure AWS credentials (OIDC if available)
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' && env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update Kubeconfig for EKS
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' || env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          set -euo pipefail
          CLUSTER_NAME="${EKS_CLUSTER_NAME:-${CLUSTER}}"
          echo "Updating kubeconfig for EKS cluster ${CLUSTER_NAME} in ${{ env.AWS_REGION }}"
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${{ env.AWS_REGION }}"
          kubectl config current-context
          kubectl config view --minify --output yaml
          kubectl cluster-info || true
          kubectl version --short

      - name: Obtener URL del Frontend (LoadBalancer)
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' || env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl get svc frontend || true
          kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "Buscando dirección..."

      - name: AWS credentials not configured for LoadBalancer lookup
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' && env.AWS_ACCESS_KEY_ID == '' }}
        run: |
          echo "AWS credentials not configured; skipping LoadBalancer URL lookup."
          echo "Set AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY in repository secrets to enable it."
