
name: Integración Continua Completa
on:
  push:
    branches:
      - devops

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: despachos-cluster
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # === TESTS ===
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests (Despacho)
        continue-on-error: true
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          chmod +x mvnw
          ./mvnw test -DskipTests=false

      - name: Run Backend Tests (Ventas)
        continue-on-error: true
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          chmod +x mvnw
          ./mvnw test -DskipTests=false

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './front_despacho/package-lock.json'

      - name: Install Dependencies
        run: |
          cd front_despacho
          npm ci || npm install --frozen-lockfile

  # === BUILD DE IMÁGENES DOCKER ===
  build-and-push:
    needs: [backend-tests, frontend-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get Account ID
        id: account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Make ECR Repositories Public
        continue-on-error: true
        run: |
          REPOS=("backend-despacho" "backend-ventas" "frontend-despacho")
          for REPO in "${REPOS[@]}"; do
            echo "📢 Haciendo público el repositorio: $REPO"
            
            # Crear repositorio si no existe
            aws ecr describe-repositories --repository-names $REPO --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name $REPO --region ${{ env.AWS_REGION }}
            
            # Configurar política pública
            aws ecr set-repository-policy \
              --repository-name $REPO \
              --policy-text '{
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "PublicPull",
                    "Effect": "Allow",
                    "Principal": "*",
                    "Action": [
                      "ecr:GetDownloadUrlForLayer",
                      "ecr:BatchGetImage",
                      "ecr:BatchCheckLayerAvailability"
                    ]
                  }
                ]
              }' \
              --region ${{ env.AWS_REGION }}
            
            echo " $REPO configurado como público"
          done

      - name: Build and Push Backend Despacho
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker build -t $ECR_REGISTRY/backend-despacho:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/backend-despacho:latest \
            -f back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile \
            back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/backend-despacho:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/backend-despacho:latest

      - name: Build and Push Backend Ventas
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker build -t $ECR_REGISTRY/backend-ventas:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/backend-ventas:latest \
            -f back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile \
            back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/backend-ventas:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/backend-ventas:latest

      - name: Build and Push Frontend
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker build -t $ECR_REGISTRY/frontend-despacho:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/frontend-despacho:latest \
            -f front_despacho/Dockerfile \
            front_despacho
          docker push $ECR_REGISTRY/frontend-despacho:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/frontend-despacho:latest

      - name: Save Account ID
        run: echo "${{ steps.account.outputs.account_id }}" > account_id.txt

      - name: Upload Account ID
        uses: actions/upload-artifact@v4
        with:
          name: account-id
          path: account_id.txt

  # === DEPLOY A EKS ===
  deploy-to-eks:
    needs: build-and-push
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl and Helm
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update kubeconfig
        id: kubeconfig
        continue-on-error: true
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Download Account ID
        uses: actions/download-artifact@v4
        with:
          name: account-id

      - name: Get Account ID
        id: account
        run: echo "account_id=$(cat account_id.txt)" >> $GITHUB_OUTPUT

      - name: Create/Update ConfigMap and Secrets
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          kubectl apply -f infra/k8s/configmap-secrets.yml || echo "⚠️  ConfigMap/Secrets actualizado"

      - name: Deploy MySQL
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          kubectl apply -f infra/k8s/mysql.yml

      - name: Deploy Backend Despacho
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          sed -e "s|\${ACCOUNT_ID}|${{ steps.account.outputs.account_id }}|g" \
              -e "s|\${AWS_REGION}|${{ env.AWS_REGION }}|g" \
              -e "s|\${IMAGE_TAG}|${{ env.IMAGE_TAG }}|g" \
              infra/k8s/backend.yml | kubectl apply -f -
          echo "✅ Backend Despacho desplegado"

      - name: Deploy Backend Ventas
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          sed -e "s|\${ACCOUNT_ID}|${{ steps.account.outputs.account_id }}|g" \
              -e "s|\${AWS_REGION}|${{ env.AWS_REGION }}|g" \
              -e "s|\${IMAGE_TAG}|${{ env.IMAGE_TAG }}|g" \
              infra/k8s/backend-ventas.yml | kubectl apply -f -
          echo " Backend Ventas desplegado"

      - name: Deploy Frontend
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          sed -e "s|\${ACCOUNT_ID}|${{ steps.account.outputs.account_id }}|g" \
              -e "s|\${AWS_REGION}|${{ env.AWS_REGION }}|g" \
              -e "s|\${IMAGE_TAG}|${{ env.IMAGE_TAG }}|g" \
              infra/k8s/frontend.yml | kubectl apply -f -
          echo " Frontend desplegado"

      - name: Install AWS Load Balancer Controller
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          if ! kubectl get deployment -n kube-system aws-load-balancer-controller &>/dev/null; then
            echo " Instalando AWS Load Balancer Controller..."
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update
            helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
              -n kube-system \
              --set clusterName=${{ env.EKS_CLUSTER_NAME }} \
              --set serviceAccount.create=true \
              --wait --timeout 5m || true
            sleep 10
          else
            echo " AWS Load Balancer Controller ya existe"
          fi

      - name: Deploy Ingress
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          kubectl apply -f infra/k8s/ingress.yml
          echo " Ingress desplegado"

      - name: Wait for ALB DNS
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo " Esperando DNS del ALB (60 segundos)..."
          for i in {1..6}; do
            URL=$(kubectl get ingress despacho-ingress -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ -n "$URL" ]; then
              echo ""
              echo "╔════════════════════════════════════════════════════════════╗"
              echo "║         🎉 ¡APLICACIÓN DESPLEGADA EXITOSAMENTE! 🎉         ║"
              echo "╠════════════════════════════════════════════════════════════╣"
              echo "║                                                            ║"
              echo "║  URL PÚBLICA: http://$URL"
              echo "║                                                            ║"
              echo "║   API Despachos: http://$URL/api/despachos/"
              echo "║   API Ventas:    http://$URL/api/ventas/"
              echo "║   Frontend:      http://$URL"
              echo "║                                                            ║"
              echo "╚════════════════════════════════════════════════════════════╝"
              echo ""
              exit 0
            fi
            echo " Intento $i/6..."
            sleep 10
          done
          echo "  Timeout esperando DNS."
          echo "Verifica con: kubectl get ingress despacho-ingress -n default -o wide"

      - name: Show Cluster Status
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "═══════ ESTADO DEL CLUSTER ═══════"
          echo ""
          echo "Pods desplegados:"
          kubectl get pods -n default
          echo ""
          echo "Servicios:"
          kubectl get svc -n default
          echo ""
          echo "Ingress:"
          kubectl get ingress -n default

      - name: Obtener URL del Frontend (LoadBalancer)
        if: steps.kubeconfig.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo " Obteniendo URL del Frontend desde el Ingress..."
          echo ""
          kubectl get svc frontend-despacho
          echo ""
          FRONTEND_URL=$(kubectl get service frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || kubectl get service frontend-despacho -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null) || true
          if [ -n "$FRONTEND_URL" ]; then
            echo " URL del LoadBalancer: http://$FRONTEND_URL"
          else
            echo " El LoadBalancer aún no tiene asignada una dirección pública"
          fi