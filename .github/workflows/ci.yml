name: Integración Continua

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - devops

env:
  AWS_REGION: us-east-1
  CLUSTER: innovatech-cluster
  # Repository secrets usados por este workflow:
  # - AWS_ACCESS_KEY_ID
  # - AWS_SECRET_ACCESS_KEY
  # - AWS_SESSION_TOKEN
  # - AWS_ROLE_TO_ASSUME (opcional para OIDC)
  # - EKS_CLUSTER_NAME
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  # Job para validar los backends Java
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Configura Java 17 para ejecutar pruebas Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests (Despacho)
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test -DskipTests=false

      - name: Run Backend Tests (Venta)
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test -DskipTests=false

  # Job para validar el frontend y construir artefactos
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Configura Node.js para instalar dependencias del frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'front_despacho/package-lock.json'

      # Instala dependencias del frontend
      - name: Install Dependencies
        working-directory: front_despacho
        run: |
          npm ci --no-audit --no-fund

      # Ejecuta pruebas del frontend solo si existe un script de test
      - name: Run Frontend Tests
        working-directory: front_despacho
        run: |
          if npm run | grep -q '"test"'; then
            npm run test
          else
            echo "No frontend test script defined; skipping tests."
          fi

      # Configura Java para compilar los microservicios con Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Genera los JAR de los backends para validar el build
      - name: Build Backends JARs
        run: |
          set -e
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
          cd ../../back-Ventas_SpringBoot/Springboot-API-REST
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      # Configura Node.js nuevamente para construir el frontend
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Compila la aplicación frontend para producción
      - name: Build Frontend Production
        working-directory: front_despacho
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Detecta si hay credenciales de AWS disponibles para EKS
      - name: Detect AWS authentication mode
        id: aws-auth
        shell: bash
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$AWS_ROLE_TO_ASSUME" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

          echo "AWS_ROLE_TO_ASSUME configured: $([ -n "$AWS_ROLE_TO_ASSUME" ] && echo yes || echo no)"
          echo "AWS_ACCESS_KEY_ID configured: $([ -n "$AWS_ACCESS_KEY_ID" ] && echo yes || echo no)"
          echo "AWS_SECRET_ACCESS_KEY configured: $([ -n "$AWS_SECRET_ACCESS_KEY" ] && echo yes || echo no)"

      # Configura credenciales AWS para poder interactuar con EKS si están disponibles
      - name: Configure AWS credentials (OIDC if available)
        if: ${{ steps.aws-auth.outputs.mode == 'oidc' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Usa credenciales de acceso como respaldo si no existe OIDC
      - name: Configure AWS credentials (access keys fallback)
        if: ${{ steps.aws-auth.outputs.mode == 'keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Instala kubectl para revisar el cluster de Kubernetes
      - name: Install kubectl

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Conecta el runner con el cluster EKS mediante kubeconfig
      - name: Update Kubeconfig for EKS
        if: ${{ steps.aws-auth.outputs.mode != 'none' }}
        run: |
          set -euo pipefail
          CLUSTER_NAME="${EKS_CLUSTER_NAME:-${CLUSTER}}"
          echo "Updating kubeconfig for EKS cluster ${CLUSTER_NAME} in ${{ env.AWS_REGION }}"
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${{ env.AWS_REGION }}"
          kubectl config current-context
          kubectl config view --minify --output yaml
          kubectl cluster-info || true
          kubectl version

      # Indica que la URL del frontend se obtiene en el workflow de CD después del despliegue
      - name: Frontend URL note
        if: ${{ steps.aws-auth.outputs.mode != 'none' }}
        run: |
          echo "The frontend URL is created during the CD workflow after the Kubernetes service is deployed and the LoadBalancer becomes ready."

      - name: AWS credentials not configured for LoadBalancer lookup
        if: ${{ steps.aws-auth.outputs.mode == 'none' }}
        run: |
          echo "AWS credentials not configured; skipping LoadBalancer URL lookup."
          echo "Set AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY in repository secrets to enable it."
