name: Intregación Continua

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - devops
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests (Despacho)
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test -DskipTests=false

      - name: Run Backend Tests (Venta)
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test -DskipTests=false

  # --- TRABAJO 2: TESTEAR EL FRONTEND (REACT) ---
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'front_despacho/package-lock.json'

      - name: Install Dependencies
        working-directory: front_despacho
        run: |
          npm ci --no-audit --no-fund

      - name: Run Frontend Tests
        working-directory: front_despacho
        run: |
          npm test
      
      # --- 3. COMPILACIÓN DE AMBOS BACKENDS (JAVA/MAVEN) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backends JARs
        run: |
          set -e
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
          cd ../../back-Ventas_SpringBoot/Springboot-API-REST
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
      
      # --- 4. COMPILACIÓN DEL FRONTEND (NODE/VITE) ---
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend Production
        working-directory: front_despacho
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate AWS credentials
        id: aws-validate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # Default to invalid
          echo "valid=false" >> $GITHUB_OUTPUT
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_DEFAULT_REGION
            if aws sts get-caller-identity >/dev/null 2>&1; then
              echo "valid=true" >> $GITHUB_OUTPUT
            else
              echo "valid=false" >> $GITHUB_OUTPUT
              echo "AWS credentials present but invalid or expired. Skipping AWS steps."
            fi
          else
            echo "AWS credentials not configured; skipping AWS steps."
          fi

      - name: Configure AWS via OIDC (if role configured)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Debug AWS caller identity (OIDC)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        run: |
          aws sts get-caller-identity || true

      - name: Configure AWS credentials (action)
        if: steps.aws-validate.outputs.valid == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Update kubeconfig
        if: steps.aws-validate.outputs.valid == 'true'
        run: |
          aws eks update-kubeconfig --region us-east-1 --name despachos-cluster

      - name: Obtener URL del Frontend (LoadBalancer)
        if: steps.aws-validate.outputs.valid == 'true'
        run: |
          kubectl get svc frontend || true
          kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "Buscando dirección..."